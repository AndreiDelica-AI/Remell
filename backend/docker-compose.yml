version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: remell-postgres
    environment:
      POSTGRES_USER: remell_user
      POSTGRES_PASSWORD: remell_password
      POSTGRES_DB: remell_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: remell-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
